name: Enzonic database availability monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enzonic-database-monitor
  cancel-in-progress: false

jobs:
  check-enzonic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout monitor state
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check connection and notify only on recovery
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          SOURCE_DB_SSL: "true"
          SOURCE_DB_SSL_CA: ${{ secrets.SOURCE_DB_SSL_CA }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          STATE_FILE=".github/enzonic-monitor-state"
          mkdir -p .github
          PREVIOUS_STATE="$(cat "$STATE_FILE" 2>/dev/null || echo DOWN)"

          if [ -z "$SOURCE_DATABASE_URL" ]; then
            echo "::error::Add SOURCE_DATABASE_URL in GitHub repository Actions secrets."
            exit 1
          fi
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::Add RESEND_API_KEY in GitHub repository Actions secrets."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/enzonic-monitor"
          npm install --prefix "$RUNNER_TEMP/enzonic-monitor" --no-save mysql2

          if node <<'NODE'
          const mysql = require(process.env.RUNNER_TEMP + '/enzonic-monitor/node_modules/mysql2/promise');
          async function main() {
            const url = new URL(process.env.SOURCE_DATABASE_URL);
            if (!['mysql:', 'mysql2:'].includes(url.protocol)) throw new Error('SOURCE_DATABASE_URL must use mysql://');
            const ssl = (process.env.SOURCE_DB_SSL || 'true').toLowerCase() !== 'false'
              ? { rejectUnauthorized: true, ...(process.env.SOURCE_DB_SSL_CA ? { ca: process.env.SOURCE_DB_SSL_CA } : {}) }
              : undefined;
            const connection = await mysql.createConnection({
              host: url.hostname, port: Number(url.port || 3306),
              user: decodeURIComponent(url.username), password: decodeURIComponent(url.password),
              database: decodeURIComponent(url.pathname.slice(1)),
              ssl, connectTimeout: 10000, multipleStatements: false
            });
            try {
              const [rows] = await connection.query('SELECT DATABASE() AS databaseName, VERSION() AS serverVersion');
              console.log('[ENZONIC MONITOR] CONNECTION_OK');
              console.log('[ENZONIC MONITOR] Database:', rows[0].databaseName);
              console.log('[ENZONIC MONITOR] Server:', rows[0].serverVersion);
            } finally { await connection.end(); }
          }
          main().catch(error => {
            console.error('[ENZONIC MONITOR] CONNECTION_FAILED');
            console.error('[ENZONIC MONITOR] Error code:', error.code || 'UNKNOWN');
            console.error('[ENZONIC MONITOR] Message:', error.message);
            process.exitCode = 1;
          });
          NODE
          then
            STATUS="UP"
          else
            STATUS="DOWN"
          fi

          if [ "$STATUS" = "UP" ] && [ "$PREVIOUS_STATE" != "UP" ]; then
            echo "[ENZONIC MONITOR] Recovery detected; sending one email."
            curl --fail --silent --show-error https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"from":"Enzonic Monitor <onboarding@resend.dev>","to":["misho6344@gmail.com"],"subject":"NoAdFrame database connection restored","html":"<p>Enzonic database connection has been restored.</p><p>The monitor successfully connected to the database. This notification is sent once per recovery.</p>"}'
          elif [ "$STATUS" = "UP" ]; then
            echo "[ENZONIC MONITOR] Connection remains healthy; no email sent."
          else
            echo "[ENZONIC MONITOR] Database is still unavailable."
          fi

          if [ "$PREVIOUS_STATE" != "$STATUS" ]; then
            printf '%s\n' "$STATUS" > "$STATE_FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$STATE_FILE"
            git commit -m "chore: update Enzonic monitor state to $STATUS"
            git push
          fi

          if [ "$STATUS" = "DOWN" ]; then exit 1; fi
